name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Configure git
        # The suite creates real repositories and worktrees; git refuses to
        # commit without an identity.
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "lazyfish CI"
          git config --global init.defaultBranch main

      - name: Lint
        run: ruff check lazyfish tests

      - name: Format check
        run: ruff format --check lazyfish tests

      - name: Invariants
        # Run separately so a violation is obvious in the job list: no LLM
        # calls, no AI subprocesses, English-only sources.
        run: pytest tests/test_invariants.py -v

      - name: Tests
        run: pytest -q
